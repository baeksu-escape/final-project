# 공개 테스트 전용 값, 실제 키 아님 — test 프로필(@ActiveProfiles("test"))에서만 쓴다. 팀 개발 키·실제 DB 접속 정보는 넣지 않는다.
# AES·HMAC 키는 docs/spec/sql/dummy_db/tools/tests/test_build_db.py의 고정 공개 테스트 키(TEST_AES = bytes 0..31, TEST_HMAC = bytes 32..63)와 같다.
# JWT 키는 같은 방식으로 만든 공개 값(bytes 64..127)이다.

# 실제 DB 없이 컨텍스트를 띄우는 메모리 DB(H2). SQL을 실제로 검사하는 것은 Oracle에서 한다.
spring.datasource.url=jdbc:h2:mem:avenue;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
mybatis.mapper-locations=classpath:mapper/**/*.xml

