# 신용모형 합성데이터 설정 (교육용 프로젝트)
#
# 값의 성격 구분
#   stats(아래)       : 공식 통계에서 확인한 값. 출처·기준시점·모집단·연체 정의를 sources 에 기록
#   derived           : 공식 통계에서 계산으로 도출한 값 (예: 소득 분포 모수)
#   assumption        : 통계 없이 설계자가 정한 가정. 값을 통계에 맞춰 억지로 조정하지 않는다
#
# 원칙
#   - 직업 세그먼트는 급여소득자 / 자영업자 / 프리랜서 3종이다.
#   - 공식 통계는 세그먼트별로 대응하는 모집단에만 쓴다. 현재 확정된 공식 통계는 임금근로자(= 급여소득자)뿐이다.
#     자영업자·프리랜서 값은 전부 가정이며 임금근로자 통계를 섞어 쓰지 않는다.
#   - 대출잔액·대출건수 기준 연체율은 개인별 연체 확률(PD)이나 계수의 목표값으로 직접 쓰지 않는다.
#     (합성 데이터에서 같은 방식으로 계산한 값과 비교만 한다: outputs/reference_checks.csv, 급여소득자 세그먼트 한정)
#   - 직접 비교 가능한 개인 단위 구간별 목표 통계가 없으므로 validation.bins 의 targets 는 비워 둔다.

seed: 42
n: 200000

meta:
  population: "대출 보유자(차주, 합성). 직업 세그먼트 3종: 급여소득자(공식 임금근로자 통계에 대응), 자영업자·프리랜서(확정 공식 통계 없음, 가정)"
  unit: "금액은 만원, 소득은 연소득(월소득 x 12). 자영업자·프리랜서의 소득은 사업·용역 소득"

# 공식 통계와 대응하는 세그먼트 (소득·대출 분포 보정, 전체 연체율 기준 보정, 참고 비교에 사용)
official_segment: wage

# ---------------------------------------------------------------------------
# 직업 세그먼트
#   세그먼트 정의(팀 확정 필요): 급여소득자 = 임금근로자(근로소득),
#   자영업자 = 개인사업자(사업소득), 프리랜서 = 고용관계 없이 용역계약으로 소득을 얻는 사람(용역·사업소득)
#   share, age_share(20s,30s,40s,50s,60p 순서), income_*, loan_mult, vol_mult 는 급여소득자의 소득·대출 평균 보정을 제외하고 모두 assumption
# ---------------------------------------------------------------------------
segments:
  wage:
    label: 급여소득자
    share: 0.60
    age_share: [0.19, 0.21, 0.25, 0.24, 0.11]
    income_median_mult: 1.0      # 공식 월 중위소득 기준 (derived)
    income_sigma: null           # null = 공식 월평균·중위소득에서 도출한 값(derived) 사용
    loan_mult: 1.0               # 급여소득자는 공식 평균대출 보정값을 그대로 사용
    vol_mult: 1.0                # 소득 변동성 배율 (기준)
    input_basis: "소득 분포와 평균 대출은 공식 임금근로자 통계 기반 (대출자 비중은 가정). 구성비·연령 분포·변동성은 가정"
  selfemp:
    label: 자영업자
    share: 0.25
    age_share: [0.05, 0.17, 0.30, 0.30, 0.18]
    income_median_mult: 1.0
    income_sigma: 0.90
    loan_mult: 1.6               # 급여소득자 같은 연령군 평균 대출 대비 배율
    vol_mult: 1.7
    input_basis: "전부 가정 (확정된 공식 통계 없음)"
  freelance:
    label: 프리랜서
    share: 0.15
    age_share: [0.22, 0.36, 0.24, 0.12, 0.06]
    income_median_mult: 0.8
    income_sigma: 0.90
    loan_mult: 0.9
    vol_mult: 2.0
    input_basis: "전부 가정 (공식 통계 미확보)"

# ---------------------------------------------------------------------------
# 출처 (공식 통계)
# ---------------------------------------------------------------------------
sources:
  wage_income_2024:
    title: "2024년 임금근로일자리 소득(보수) 결과"
    agency: "국가데이터처 / 일자리행정통계"
    reference_date: "2024-12"
    published: "2026-02-23"
    population: "임금근로자 (임금근로일자리 기준)"
    url: "https://mods.go.kr/board.es?act=view&bid=11113&list_no=443648&mid=a10301030500"
  wage_debt_2024:
    title: "2024년 일자리행정통계 임금근로자 부채"
    agency: "국가데이터처 / 일자리행정통계"
    reference_date: "2024-12 말"
    population: "임금근로자 (2024년 일자리행정통계 임금근로 일자리에서 하루 이상 일한 근로자. 외국인·개인사업 겸업자 제외)"
    average_loan_basis: "평균대출은 전체 임금근로자 1인당 (대출이 없는 임금근로자 포함). 대출자 1인당이 아님"
    delinquency_definition: "개인대출 원금·이자 등 3개월 이상 연체, 2024년 12월 말 시점. 연체율은 대출잔액·대출건수·대출차주수 기준이 서로 다름"
    url: "https://www.mods.go.kr/boardDownload.es?bid=11113&list_no=444177&seq=1"
  selfemp_debt_2024:
