# FP-305 개발·시연용 Elasticsearch 하나만 띄운다(Docker가 있는 PC). 사용법은 같은 폴더 README.md.
# 보안을 끈 한 대짜리 서버이고 9200 포트를 이 PC에만 연다. 팀 전체 compose(FP-286)가 생기면 아래 서비스 정의를 그쪽으로 옮긴다.
services:
  elasticsearch:
    build: .
    image: avenue-elasticsearch:8.10.4
    container_name: avenue-elasticsearch
    environment:
      - cluster.name=avenue-dev
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - avenue-es-data:/usr/share/elasticsearch/data

volumes:
  avenue-es-data:
